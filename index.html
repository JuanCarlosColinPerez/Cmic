<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- Configuración Segura de Supabase ---------- */
const SUPABASE_URL = 'https://nuxipyqrutvaaoqhqmzl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_F3PsWbC9rwMJfxwwTYqQvg_Ck6JjFeT';

let supabaseClient = null;

try {
  if (typeof supabase !== 'undefined') {
    const customFetch = (url, options = {}) => {
      if (options.headers && typeof options.headers.forEach === 'function') {
        const plainHeaders = {};
        options.headers.forEach((val, key) => { plainHeaders[key] = val; });
        options.headers = plainHeaders;
      }
      return fetch(url, options);
    };

    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      global: { fetch: customFetch }
    });
  }
} catch (e) {
  console.warn('Supabase no pudo inicializarse, usando modo local:', e);
}

/* ---------- Configuración de Módulos ---------- */
const MODULES = {
  finanzas: {
    key: 'erp_finanzas',
    label: 'movimiento',
    fields: [
      {name: 'fecha', label: 'Fecha', type: 'date', required: true},
      {name: 'tipo', label: 'Tipo', type: 'select', options: ['Ingreso', 'Egreso'], required: true},
      {name: 'categoria', label: 'Categoría', type: 'text', placeholder: 'Cuotas, Cursos, Nómina...'},
      {name: 'concepto', label: 'Concepto', type: 'text', required: true},
      {name: 'monto', label: 'Monto (MXN)', type: 'number', required: true},
      {name: 'cuenta', label: 'Cuenta / medio', type: 'text', placeholder: 'Banco, caja, transferencia...'}
    ],
    columns: ['fecha', 'tipo', 'categoria', 'concepto', 'cuenta', 'monto'],
    colLabels: ['Fecha', 'Tipo', 'Categoría', 'Concepto', 'Cuenta', 'Monto']
  },
  licitaciones: {
    key: 'erp_licitaciones',
    label: 'licitación',
    fields: [
      {name: 'numero', label: 'Número de licitación', type: 'text', required: true},
      {name: 'dependencia', label: 'Dependencia', type: 'text', required: true},
      {name: 'objeto', label: 'Objeto', type: 'textarea'},
      {name: 'monto', label: 'Monto estimado (MXN)', type: 'number'},
      {name: 'fechaLimite', label: 'Fecha límite', type: 'date'},
      {name: 'estado', label: 'Estado', type: 'select', options: ['Por participar', 'En proceso', 'Ganada', 'Perdida', 'Descartada'], required: true},
      {name: 'prioridad', label: 'Prioridad', type: 'select', options: ['Alta', 'Media', 'Baja']}
    ],
    columns: ['numero', 'dependencia', 'fechaLimite', 'estado', 'prioridad', 'monto'],
    colLabels: ['Número', 'Dependencia', 'Fecha límite', 'Estado', 'Prioridad', 'Monto est.']
  },
  miembros: {
    key: 'erp_miembros',
    label: 'miembro',
    fields: [
      {name: 'nombre', label: 'Nombre o Representante', type: 'text', required: true},
      {name: 'empresa', label: 'Razón Social / Empresa', type: 'text'},
      {name: 'folio', label: 'Folio / Registro', type: 'text'},
      {name: 'telefono', label: 'Teléfono', type: 'text'},
      {name: 'email', label: 'Correo electrónico', type: 'text'},
      {name: 'estadoCuota', label: 'Estado de cuota', type: 'select', options: ['Al corriente', 'Pendiente', 'Vencida'], required: true},
      {name: 'montoCuota', label: 'Monto cuota (MXN)', type: 'number'},
      {name: 'vencimiento', label: 'Próximo vencimiento', type: 'date'}
    ],
    columns: ['folio', 'nombre', 'empresa', 'telefono', 'estadoCuota', 'vencimiento'],
    colLabels: ['Folio', 'Nombre', 'Empresa', 'Teléfono', 'Estado cuota', 'Vencimiento']
  },
  activos: {
    key: 'erp_activos',
    label: 'activo',
    fields: [
      {name: 'codigo', label: 'Código / Serie', type: 'text', required: true},
      {name: 'nombre', label: 'Nombre del activo', type: 'text', required: true},
      {name: 'categoria', label: 'Categoría', type: 'text', placeholder: 'Mobiliario, Equipo, Vehículo...'},
      {name: 'ubicacion', label: 'Ubicación / Área', type: 'text'},
      {name: 'responsable', label: 'Responsable', type: 'text'},
      {name: 'valor', label: 'Valor estim. (MXN)', type: 'number'},
      {name: 'estado', label: 'Estado', type: 'select', options: ['Operativo', 'Mantenimiento', 'Baja'], required: true}
    ],
    columns: ['codigo', 'nombre', 'categoria', 'ubicacion', 'responsable', 'estado', 'valor'],
    colLabels: ['Código', 'Nombre', 'Categoría', 'Ubicación', 'Responsable', 'Estado', 'Valor']
  },
  crm: {
    key: 'erp_crm',
    label: 'prospecto',
    fields: [
      {name: 'nombre', label: 'Contacto principal', type: 'text', required: true},
      {name: 'empresa', label: 'Empresa / Dependencia', type: 'text'},
      {name: 'etapa', label: 'Etapa del embudo', type: 'select', options: ['Prospecto', 'Contactado', 'Propuesta', 'Negociación', 'Ganado', 'Perdido'], required: true},
      {name: 'monto', label: 'Monto potencial (MXN)', type: 'number'},
      {name: 'responsable', label: 'Responsable interno', type: 'text'},
      {name: 'proximaAccion', label: 'Próxima acción', type: 'text'},
      {name: 'fechaAccion', label: 'Fecha de acción', type: 'date'},
      {name: 'notas', label: 'Notas', type: 'textarea'}
    ],
    columns: [],
    colLabels: []
  }
};

/* ---------- Funciones de Almacenamiento ---------- */
async function getData(mod) {
  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient
        .from('erp_store')
        .select('value')
        .eq('key', MODULES[mod].key)
        .maybeSingle();

      if (!error && data && data.value) {
        localStorage.setItem(MODULES[mod].key, JSON.stringify(data.value));
        return data.value;
      }
    } catch (e) {
      console.error('Error conectando con Supabase:', e);
    }
  }

  try { return JSON.parse(localStorage.getItem(MODULES[mod].key)) || []; }
  catch(e) { return []; }
}

async function setData(mod, arr) {
  localStorage.setItem(MODULES[mod].key, JSON.stringify(arr));

  if (supabaseClient) {
    try {
      await supabaseClient
        .from('erp_store')
        .upsert({ key: MODULES[mod].key, value: arr, updated_at: new Date() }, { onConflict: 'key' });
    } catch(e) {
      console.error('Error al guardar en Supabase:', e);
    }
  }
}

/* ---------- Navegación ---------- */
let currentView = 'dashboard';
let editingModule = null;
let editingId = null;

function initNavigation() {
  const items = document.querySelectorAll('#navMenu .nav-item');
  items.forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('#navMenu .nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      
      item.classList.add('active');
      const viewName = item.dataset.view;
      currentView = viewName;
      const targetView = document.getElementById(`view-${viewName}`);
      if (targetView) targetView.classList.add('active');
      
      renderCurrentView();
    });
  });
}

function renderCurrentView() {
  if (currentView === 'dashboard') renderDashboard();
  else if (currentView === 'crm') renderCRMBoard();
  else if (MODULES[currentView]) renderTable(currentView);
}

/* ---------- Utilidades ---------- */
function fdate(d) {
  if (!d) return '-';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('es-MX', {day: '2-digit', month: 'short', year: 'numeric'});
}

function daysUntil(d) {
  if (!d) return null;
  const dt = new Date(d + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((dt - now) / 86400000);
}

function fcurrency(num) {
  if (num === null || num === undefined || num === '') return '-';
  return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(num);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

/* ---------- Render Tablas ---------- */
async function renderTable(mod) {
  const cfg = MODULES[mod];
  let data = await getData(mod);
  const container = document.getElementById(`table-${mod}`);
  if (!container) return;
  
  const searchEl = document.getElementById(`search-${mod}`);
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
  if (q) {
    data = data.filter(r => Object.values(r).some(v => String(v || '').toLowerCase().includes(q)));
  }

  const filterEl = document.querySelector(`#view-${mod} .filter-select`);
  if (filterEl && filterEl.value) {
    const filterField = mod === 'finanzas' ? 'tipo' : (mod === 'licitaciones' ? 'estado' : (mod === 'miembros' ? 'estadoCuota' : 'estado'));
    data = data.filter(r => r[filterField] === filterEl.value);
  }

  if (!data.length) {
    container.innerHTML = `<div class="empty-state">No hay registros de ${cfg.label}s.</div>`;
    return;
  }

  let html = `<table><thead><tr>`;
  cfg.colLabels.forEach(l => html += `<th>${l}</th>`);
  html += `<th style="text-align:right">Acciones</th></tr></thead><tbody>`;

  data.forEach(item => {
    html += `<tr>`;
    cfg.columns.forEach(col => {
      let val = item[col] || '-';
      let cls = '';
      if (col === 'monto' || col === 'valor' || col === 'montoCuota') {
        val = fcurrency(item[col]);
        cls = 'num';
      } else if (col === 'fecha' || col === 'fechaLimite' || col === 'vencimiento') {
        val = fdate(item[col]);
      } else if (col === 'estado' || col === 'estadoCuota' || col === 'tipo' || col === 'prioridad') {
        let tagCls = 'tag-gray';
        if (['Ingreso', 'Ganada', 'Al corriente', 'Operativo'].includes(val)) tagCls = 'tag-green';
        if (['Egreso', 'Perdida', 'Vencida', 'Baja'].includes(val)) tagCls = 'tag-red';
        if (['En proceso', 'Pendiente', 'Por participar', 'Mantenimiento', 'Alta'].includes(val)) tagCls = 'tag-amber';
        val = `<span class="tag ${tagCls}">${val}</span>`;
      }
      html += `<td class="${cls}">${val}</td>`;
    });
    html += `<td class="actions">
      <button class="icon-btn" onclick="openModal('${mod}', '${item.id}')">✏️ Editar</button>
    </td></tr>`;
  });

  html += `</tbody></table>`;
  container.innerHTML = html;
}

/* ---------- Render CRM Kanban ---------- */
async function renderCRMBoard() {
  let data = await getData('crm');
  const board = document.getElementById('board-crm');
  if (!board) return;

  const stages = ['Prospecto', 'Contactado', 'Propuesta', 'Negociación', 'Ganado', 'Perdido'];
  
  const searchEl = document.getElementById('search-crm');
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
  if (q) {
    data = data.filter(r => Object.values(r).some(v => String(v || '').toLowerCase().includes(q)));
  }

  const respEl = document.getElementById('filter-crm-responsable');
  if (respEl) {
    const resps = [...new Set(data.map(d => d.responsable).filter(Boolean))];
    respEl.innerHTML = `<option value="">Todos los responsables</option>` + resps.map(r => `<option value="${r}">${r}</option>`).join('');
  }

  let html = '';
  stages.forEach(st => {
    const items = data.filter(d => d.etapa === st);
    html += `<div class="kanban-col" data-stage="${st}">
      <div class="kanban-col-head">
        <span>${st}</span>
        <span class="kanban-count">${items.length}</span>
      </div>
      <div class="kanban-body">`;
    
    if (!items.length) {
      html += `<div class="kanban-empty">Sin prospectos</div>`;
    } else {
      items.forEach(it => {
        html += `<div class="kanban-card" onclick="openModal('crm', '${it.id}')">
          <div class="kc-name">${it.nombre}</div>
          <div class="kc-empresa">${it.empresa || 'Sin empresa'}</div>
          <div class="kc-foot">
            <span class="tag tag-amber">${fcurrency(it.monto)}</span>
            <span class="kc-action">${it.proximaAccion ? '📌 ' + it.proximaAccion : ''}</span>
          </div>
        </div>`;
      });
    }
    html += `</div></div>`;
  });
  board.innerHTML = html;
}

/* ---------- Render Dashboard ---------- */
async function renderDashboard() {
  const fin = await getData('finanzas');
  const lic = await getData('licitaciones');
  const mie = await getData('miembros');
  const act = await getData('activos');
  const crm = await getData('crm');

  const todayEl = document.getElementById('todayDate');
  if (todayEl) {
    todayEl.textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  const ingresos = fin.filter(f => f.tipo === 'Ingreso').reduce((s, f) => s + (Number(f.monto) || 0), 0);
  const egresos = fin.filter(f => f.tipo === 'Egreso').reduce((s, f) => s + (Number(f.monto) || 0), 0);
  const balance = ingresos - egresos;

  const dashCards = document.getElementById('dashCards');
  if (dashCards) {
    dashCards.innerHTML = `
      <div class="card c-navy">
        <div class="card-label">Balance Total</div>
        <div class="card-value">${fcurrency(balance)}</div>
        <div class="card-foot">Ingresos: ${fcurrency(ingresos)} | Egresos: ${fcurrency(egresos)}</div>
      </div>
      <div class="card c-amber">
        <div class="card-label">Licitaciones Activas</div>
        <div class="card-value">${lic.filter(l => ['Por participar', 'En proceso'].includes(l.estado)).length}</div>
        <div class="card-foot">De ${lic.length} registradas</div>
      </div>
      <div class="card c-green">
        <div class="card-label">Miembros Activos</div>
        <div class="card-value">${mie.filter(m => m.estadoCuota === 'Al corriente').length}</div>
        <div class="card-foot">Total afiliados: ${mie.length}</div>
      </div>
      <div class="card c-red">
        <div class="card-label">Oportunidades CRM</div>
        <div class="card-value">${crm.filter(c => !['Ganado', 'Perdido'].includes(c.etapa)).length}</div>
        <div class="card-foot">En seguimiento</div>
      </div>
    `;
  }

  const alerts = [];
  lic.forEach(l => {
    const days = daysUntil(l.fechaLimite);
    if (days !== null && days <= 5 && days >= 0 && l.estado !== 'Ganada' && l.estado !== 'Perdida') {
      alerts.push({ text: `Licitación <b>${l.numero}</b> vence en ${days} días`, tag: 'Licitación', type: 'tag-red' });
    }
  });
  mie.forEach(m => {
    if (m.estadoCuota === 'Vencida' || m.estadoCuota === 'Pendiente') {
      alerts.push({ text: `Cuota de <b>${m.nombre}</b> está en estado ${m.estadoCuota}`, tag: 'Miembro', type: 'tag-amber' });
    }
  });

  const alertsContainer = document.getElementById('alertsList');
  if (alertsContainer) {
    alertsContainer.innerHTML = !alerts.length
      ? `<div style="font-size:13px; color:var(--steel); padding:10px 0;">No hay alertas pendientes.</div>`
      : alerts.slice(0, 5).map(a => `<div class="alert-row"><span>${a.text}</span><span class="tag ${a.type}">${a.tag}</span></div>`).join('');
  }

  const summaryContainer = document.getElementById('moduleSummary');
  if (summaryContainer) {
    summaryContainer.innerHTML = `
      <div class="alert-row"><span>Movimientos financieros</span><b>${fin.length}</b></div>
      <div class="alert-row"><span>Procesos de licitación</span><b>${lic.length}</b></div>
      <div class="alert-row"><span>Padrón de miembros</span><b>${mie.length}</b></div>
      <div class="alert-row"><span>Activos inventariados</span><b>${act.length}</b></div>
      <div class="alert-row"><span>Prospectos en CRM</span><b>${crm.length}</b></div>
    `;
  }
}

/* ---------- Gestor Modal (Crear / Editar) ---------- */
async function openModal(mod, id = null) {
  editingModule = mod;
  editingId = id;
  const cfg = MODULES[mod];
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const deleteBtn = document.getElementById('modalDeleteBtn');

  if (modalTitle) modalTitle.textContent = id ? `Editar ${cfg.label}` : `Nuevo ${cfg.label}`;
  if (deleteBtn) deleteBtn.style.display = id ? 'block' : 'none';

  let currentData = {};
  if (id) {
    const list = await getData(mod);
    currentData = list.find(r => r.id === id) || {};
  }

  let fieldsHtml = '';
  cfg.fields.forEach(f => {
    const val = currentData[f.name] !== undefined ? currentData[f.name] : '';
    fieldsHtml += `<div class="field"><label>${f.label}${f.required ? ' *' : ''}</label>`;
    if (f.type === 'select') {
      fieldsHtml += `<select name="${f.name}">` +
        f.options.map(o => `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`).join('') +
        `</select>`;
    } else if (f.type === 'textarea') {
      fieldsHtml += `<textarea name="${f.name}">${val}</textarea>`;
    } else {
      fieldsHtml += `<input type="${f.type}" name="${f.name}" value="${val}" placeholder="${f.placeholder || ''}" ${f.required ? 'required' : ''}>`;
    }
    fieldsHtml += `</div>`;
  });

  if (modalBody) modalBody.innerHTML = fieldsHtml;
  const overlay = document.getElementById('overlay');
  if (overlay) overlay.classList.add('active');
}

function closeModal() {
  const overlay = document.getElementById('overlay');
  if (overlay) overlay.classList.remove('active');
  editingModule = null;
  editingId = null;
}

async function saveRecord() {
  const inputs = document.querySelectorAll('#modalBody [name]');
  const record = { id: editingId || 'id_' + Date.now() };

  for (let input of inputs) {
    if (input.hasAttribute('required') && !input.value.trim()) {
      showToast('Por favor completa los campos obligatorios');
      return;
    }
    record[input.name] = input.value;
  }

  const list = await getData(editingModule);
  if (editingId) {
    const idx = list.findIndex(r => r.id === editingId);
    if (idx !== -1) list[idx] = record;
  } else {
    list.push(record);
  }

  await setData(editingModule, list);
  closeModal();
  showToast('Registro guardado exitosamente');
  renderCurrentView();
}

async function deleteRecord(mod, id) {
  if (!confirm('¿Estás seguro de eliminar este registro?')) return;
  let list = await getData(mod);
  list = list.filter(r => r.id !== id);
  await setData(mod, list);
  showToast('Registro eliminado');
  renderCurrentView();
}

/* ---------- Arranque al cargar el DOM ---------- */
document.addEventListener('DOMContentLoaded', () => {
  initNavigation();
  renderDashboard();
});
</script>
</body>
</html>
